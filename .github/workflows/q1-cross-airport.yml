name: q1-cross-airport-v6
on:
  workflow_dispatch:
jobs:
  cross-airport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Run tests
        run: pytest
      - name: Run official Q1 LAND cross-airport local search V6
        run: python experiments/run_q1_cross_airport.py --output-dir outputs/q1/cross_airport_v6
      - name: Upload cross-airport outputs
        uses: actions/upload-artifact@v4
        with:
          name: q1-cross-airport-v6
          path: outputs/q1/cross_airport_v6
          if-no-files-found: error
