name: q2-c3b-identity-free-continuation

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/run_q2_c3b_continue.py"
      - ".github/workflows/q2-c3b.yml"

permissions:
  contents: read
  actions: read

jobs:
  c3b:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Test
        run: pytest
      - name: Download Q2 C3 18959 anchor
        uses: actions/download-artifact@v4
        with:
          name: q2-c3-identity-free-allflight-pair
          path: inputs/q2_18959_anchor
          github-token: ${{ github.token }}
          repository: HaochenLv/Math_exercise_1
          run-id: 34346742969
      - name: Run Q2 C3b identity-free continuation
        run: |
          python experiments/run_q2_c3b_continue.py \
            --anchor-routes inputs/q2_18959_anchor/q2-routes.csv \
            --anchor-assignments inputs/q2_18959_anchor/q2-assignments.csv \
            --output-dir outputs/q2/c3b_continue \
            --neighbor-count 6 \
            --max-union-facilities 7 \
            --cp-time-limit 1.0 \
            --max-iterations 12 \
            --expected-anchor-minutes 18959 \
            --expected-anchor-flights 107
      - name: Upload C3b outputs
        uses: actions/upload-artifact@v4
        with:
          name: q2-c3b-identity-free-continuation
          path: outputs/q2/c3b_continue
          if-no-files-found: error
