name: q1-four-route-recombination-v9
on:
  workflow_dispatch:
jobs:
  four-route-recombination:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Run tests
        run: pytest
      - name: Run official Q1 four-route recombination V9
        run: python experiments/run_q1_four_route_recombination.py --output-dir outputs/q1/four_route_recombination_v9
      - name: Upload four-route outputs
        uses: actions/upload-artifact@v4
        with:
          name: q1-four-route-recombination-v9
          path: outputs/q1/four_route_recombination_v9
          if-no-files-found: error
