name: q1-exact-count-split-triple-v11
on:
  push:
  pull_request:
jobs:
  count-split-triple:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Run tests
        run: pytest
      - name: Run official Q1 exact count-split triple V11
        run: python experiments/run_q1_count_split_triple.py --output-dir outputs/q1/count_split_triple_v11
      - name: Upload count-split triple outputs
        uses: actions/upload-artifact@v4
        with:
          name: q1-exact-count-split-triple-v11
          path: outputs/q1/count_split_triple_v11
          if-no-files-found: error
