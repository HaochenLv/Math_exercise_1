name: q1-pair-merge-v1

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pair-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Run tests
        run: pytest
      - name: Run official Q1 pair merge V1
        run: python experiments/run_q1_pair_merge.py --output-dir outputs/q1/pair_merge_v1
      - name: Upload pair merge outputs
        uses: actions/upload-artifact@v4
        with:
          name: q1-pair-merge-v1
          path: outputs/q1/pair_merge_v1
          if-no-files-found: error
