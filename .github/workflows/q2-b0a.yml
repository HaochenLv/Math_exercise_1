name: q2-b0a-warm-start

on:
  push:
  workflow_dispatch:

jobs:
  b0a:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Test
        run: pytest
      - name: Run Q2 B0A warm-start packing
        run: |
          python experiments/run_q2_b0a_warm_start.py \
            --output-dir outputs/q2/b0a_warm_start \
            --packing-time-limit 30
      - name: Upload B0A diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: q2-b0a-warm-start
          path: outputs/q2/b0a_warm_start
