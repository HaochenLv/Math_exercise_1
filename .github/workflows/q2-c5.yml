name: q2-c5-regional-lns-sprint

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/run_q2_c5_regional_lns.py"
      - ".github/workflows/q2-c5.yml"

permissions:
  contents: read
  actions: read

jobs:
  c5:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: close5
            cluster_size: 5
            neighbor_count: 7
            max_union: 7
            max_groups: 12
            mode: close
            seed: 11
          - name: shared5
            cluster_size: 5
            neighbor_count: 9
            max_union: 7
            max_groups: 12
            mode: shared
            seed: 23
          - name: mixed6
            cluster_size: 6
            neighbor_count: 8
            max_union: 7
            max_groups: 12
            mode: mixed
            seed: 37
          - name: cost6
            cluster_size: 6
            neighbor_count: 10
            max_union: 8
            max_groups: 12
            mode: cost
            seed: 53
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Test
        run: pytest
      - name: Download Q2 C4b 18620 anchor
        uses: actions/download-artifact@v4
        with:
          name: q2-c4b-three-flight-continuation
          path: inputs/q2_18620_anchor
          github-token: ${{ github.token }}
          repository: HaochenLv/Math_exercise_1
          run-id: 34358199765
      - name: Run C5 regional LNS ${{ matrix.name }}
        run: |
          python experiments/run_q2_c5_regional_lns.py \
            --anchor-routes inputs/q2_18620_anchor/q2-routes.csv \
            --anchor-assignments inputs/q2_18620_anchor/q2-assignments.csv \
            --output-dir outputs/q2/c5_${{ matrix.name }} \
            --cluster-size ${{ matrix.cluster_size }} \
            --neighbor-count ${{ matrix.neighbor_count }} \
            --max-union-facilities ${{ matrix.max_union }} \
            --max-group-keys ${{ matrix.max_groups }} \
            --max-clusters-per-iteration 28 \
            --cp-time-limit 2.5 \
            --max-iterations 2 \
            --selection-mode ${{ matrix.mode }} \
            --seed ${{ matrix.seed }} \
            --expected-anchor-minutes 18620 \
            --expected-anchor-flights 104
      - name: Upload C5 ${{ matrix.name }} outputs
        uses: actions/upload-artifact@v4
        with:
          name: q2-c5-${{ matrix.name }}
          path: outputs/q2/c5_${{ matrix.name }}
          if-no-files-found: error
