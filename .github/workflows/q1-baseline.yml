name: q1-baseline

on:
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Run tests
        run: pytest
      - name: Run official Q1 baseline
        run: python experiments/run_q1_baseline.py --output-dir outputs/q1/baseline
      - name: Upload baseline outputs
        uses: actions/upload-artifact@v4
        with:
          name: q1-baseline
          path: outputs/q1/baseline
          if-no-files-found: error
