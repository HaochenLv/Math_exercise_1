name: q2-b1-tail-elimination

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  b1:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Test
        run: pytest
      - name: Download frozen Q1 V10 anchor
        uses: actions/download-artifact@v4
        with:
          name: q1-exact-count-split-recombination-v10
          path: inputs/q1_v10_anchor
          github-token: ${{ github.token }}
          repository: HaochenLv/Math_exercise_1
          run-id: 34131373295
      - name: Run Q2 B1 tail elimination
        run: |
          python experiments/run_q2_b1_tail_elimination.py \
            --q1-routes inputs/q1_v10_anchor/q1-routes.csv \
            --q1-assignments inputs/q1_v10_anchor/q1-assignments.csv \
            --output-dir outputs/q2/b1_tail_elimination \
            --packing-time-limit 30 \
            --max-hosts-per-donor 24
      - name: Upload B1 outputs
        uses: actions/upload-artifact@v4
        with:
          name: q2-b1-tail-elimination
          path: outputs/q2/b1_tail_elimination
          if-no-files-found: error
