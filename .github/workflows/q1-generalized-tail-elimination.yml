name: q1-generalized-tail-elimination-v5
on:
  workflow_dispatch:
jobs:
  generalized-tail-elimination:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Run tests
        run: pytest
      - name: Run official Q1 retype-aware tail elimination V5
        run: python experiments/run_q1_generalized_tail_elimination.py --output-dir outputs/q1/generalized_tail_elimination_v5
      - name: Upload generalized-tail outputs
        uses: actions/upload-artifact@v4
        with:
          name: q1-generalized-tail-elimination-v5
          path: outputs/q1/generalized_tail_elimination_v5
          if-no-files-found: error
