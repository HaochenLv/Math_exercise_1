name: q2-c4a-three-flight-destroy-repair

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/run_q2_c4a_triple_repair.py"
      - ".github/workflows/q2-c4a.yml"

permissions:
  contents: read
  actions: read

jobs:
  c4a:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Test
        run: pytest
      - name: Download Q2 C3b 18928 anchor
        uses: actions/download-artifact@v4
        with:
          name: q2-c3b-identity-free-continuation
          path: inputs/q2_18928_anchor
          github-token: ${{ github.token }}
          repository: HaochenLv/Math_exercise_1
          run-id: 34351407911
      - name: Run Q2 C4a three-flight exact destroy-and-repair
        run: |
          python experiments/run_q2_c4a_triple_repair.py \
            --anchor-routes inputs/q2_18928_anchor/q2-routes.csv \
            --anchor-assignments inputs/q2_18928_anchor/q2-assignments.csv \
            --output-dir outputs/q2/c4a_triple \
            --neighbor-count 4 \
            --max-union-facilities 6 \
            --max-group-keys 10 \
            --max-triples-per-iteration 140 \
            --cp-time-limit 1.5 \
            --max-iterations 4 \
            --expected-anchor-minutes 18928 \
            --expected-anchor-flights 107
      - name: Upload C4a outputs
        uses: actions/upload-artifact@v4
        with:
          name: q2-c4a-three-flight-destroy-repair
          path: outputs/q2/c4a_triple
          if-no-files-found: error
