name: q2-b3b-residual-main-recombination

on:
  push:
    paths:
      - ".github/workflows/q2-b3b.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  b3b:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Test
        run: pytest
      - name: Download frozen Q1 V10 anchor
        uses: actions/download-artifact@v4
        with:
          name: q1-exact-count-split-recombination-v10
          path: inputs/q1_v10_anchor
          github-token: ${{ github.token }}
          repository: HaochenLv/Math_exercise_1
          run-id: 34131373295
      - name: Run Q2 B3B extended residual x main exact recombination
        run: |
          python experiments/run_q2_b3b_residual_main.py \
            --q1-routes inputs/q1_v10_anchor/q1-routes.csv \
            --q1-assignments inputs/q1_v10_anchor/q1-assignments.csv \
            --output-dir outputs/q2/b3b_residual_main_extended \
            --packing-time-limit 30 \
            --b3a-max-iterations 40 \
            --main-neighbor-count 10 \
            --max-union-facilities 7 \
            --cp-time-limit 1.0 \
            --max-iterations 40 \
            --tail-max-hosts-per-donor 32
      - name: Upload B3B outputs
        uses: actions/upload-artifact@v4
        with:
          name: q2-b3b-residual-main-recombination-extended
          path: outputs/q2/b3b_residual_main_extended
          if-no-files-found: error
