name: q2-c4b-three-flight-continuation

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/q2-c4b.yml"

permissions:
  contents: read
  actions: read

jobs:
  c4b:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Test
        run: pytest
      - name: Download Q2 C4a 18768 anchor
        uses: actions/download-artifact@v4
        with:
          name: q2-c4a-three-flight-destroy-repair
          path: inputs/q2_18768_anchor
          github-token: ${{ github.token }}
          repository: HaochenLv/Math_exercise_1
          run-id: 34356795706
      - name: Run Q2 C4b three-flight continuation
        run: |
          python experiments/run_q2_c4a_triple_repair.py \
            --anchor-routes inputs/q2_18768_anchor/q2-routes.csv \
            --anchor-assignments inputs/q2_18768_anchor/q2-assignments.csv \
            --output-dir outputs/q2/c4b_triple \
            --neighbor-count 4 \
            --max-union-facilities 6 \
            --max-group-keys 10 \
            --max-triples-per-iteration 140 \
            --cp-time-limit 1.5 \
            --max-iterations 10 \
            --expected-anchor-minutes 18768 \
            --expected-anchor-flights 105
      - name: Upload C4b outputs
        uses: actions/upload-artifact@v4
        with:
          name: q2-c4b-three-flight-continuation
          path: outputs/q2/c4b_triple
          if-no-files-found: error
