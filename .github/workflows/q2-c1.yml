name: q2-c1-repeated-service-diagnostic

on:
  push:
    paths:
      - ".github/workflows/q2-c1.yml"
      - "experiments/run_q2_c1_repeated_service.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  c1:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Test
        run: pytest
      - name: Download frozen Q2 19126 anchor
        uses: actions/download-artifact@v4
        with:
          name: q2-b3b-residual-main-recombination-extended
          path: inputs/q2_b3b_anchor
          github-token: ${{ github.token }}
          repository: HaochenLv/Math_exercise_1
          run-id: 34323902740
      - name: Run Q2 C1 repeated-service diagnostic
        run: |
          python experiments/run_q2_c1_repeated_service.py \
            --q2-routes inputs/q2_b3b_anchor/q2-routes.csv \
            --q2-assignments inputs/q2_b3b_anchor/q2-assignments.csv \
            --output-dir outputs/q2/c1_repeated_service_diagnostic \
            --baseline-time-limit 2.0 \
            --top-k 100
      - name: Upload C1 outputs
        uses: actions/upload-artifact@v4
        with:
          name: q2-c1-repeated-service-diagnostic
          path: outputs/q2/c1_repeated_service_diagnostic
          if-no-files-found: error
