name: q1-local-search-v3
on:
  push:
  pull_request:
jobs:
  local-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Run tests
        run: pytest
      - name: Run official Q1 facility-block local search V3
        run: python experiments/run_q1_local_search.py --output-dir outputs/q1/local_search_v3
      - name: Upload local-search outputs
        uses: actions/upload-artifact@v4
        with:
          name: q1-local-search-v3
          path: outputs/q1/local_search_v3
          if-no-files-found: error
