name: q1-exact-count-split-recombination-v10
on:
  workflow_dispatch:
jobs:
  count-split-recombination:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Run tests
        run: pytest
      - name: Run official Q1 exact count-split recombination V10
        run: python experiments/run_q1_count_split_recombination.py --output-dir outputs/q1/count_split_recombination_v10
      - name: Upload count-split outputs
        uses: actions/upload-artifact@v4
        with:
          name: q1-exact-count-split-recombination-v10
          path: outputs/q1/count_split_recombination_v10
          if-no-files-found: error
