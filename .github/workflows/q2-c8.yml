name: q2-c8-global-master-sprint

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/q2-c8.yml"

permissions:
  contents: read
  actions: read

jobs:
  c8:
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: core22a
            cluster_budget: 22
            max_routes: 2200
            time_limit: 300
            seed: 401
          - tag: core22b
            cluster_budget: 22
            max_routes: 2400
            time_limit: 300
            seed: 503
          - tag: core22c
            cluster_budget: 22
            max_routes: 2600
            time_limit: 300
            seed: 607
          - tag: core20long
            cluster_budget: 20
            max_routes: 2400
            time_limit: 420
            seed: 709
          - tag: core24long
            cluster_budget: 24
            max_routes: 2400
            time_limit: 420
            seed: 811
          - tag: wide24a
            cluster_budget: 24
            max_routes: 2800
            time_limit: 300
            seed: 907
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Test
        run: pytest
      - name: Download Q2 C7 17965 anchor
        uses: actions/download-artifact@v4
        with:
          name: q2-c7-compact22a
          path: inputs/q2_17965_anchor
          github-token: ${{ github.token }}
          repository: HaochenLv/Math_exercise_1
          run-id: 34376763358
      - name: Run C8 global master ${{ matrix.tag }}
        run: |
          python experiments/run_q2_c6_global_route_pool.py \
            --anchor-routes inputs/q2_17965_anchor/q2-routes.csv \
            --anchor-assignments inputs/q2_17965_anchor/q2-assignments.csv \
            --output-dir outputs/q2/c8_${{ matrix.tag }} \
            --cluster-budget ${{ matrix.cluster_budget }} \
            --max-routes ${{ matrix.max_routes }} \
            --master-time-limit ${{ matrix.time_limit }} \
            --max-copies 25 \
            --seed ${{ matrix.seed }} \
            --expected-anchor-minutes 17965 \
            --expected-anchor-flights 100
      - name: Upload C8 ${{ matrix.tag }} outputs
        uses: actions/upload-artifact@v4
        with:
          name: q2-c8-${{ matrix.tag }}
          path: outputs/q2/c8_${{ matrix.tag }}
          if-no-files-found: error
