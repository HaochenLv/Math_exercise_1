name: q1-three-route-recombination-v7
on:
  push:
  pull_request:
jobs:
  recombination:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Run tests
        run: pytest
      - name: Run official Q1 three-route recombination V7
        run: python experiments/run_q1_recombination.py --output-dir outputs/q1/recombination_v7
      - name: Upload recombination outputs
        uses: actions/upload-artifact@v4
        with:
          name: q1-three-route-recombination-v7
          path: outputs/q1/recombination_v7
          if-no-files-found: error
