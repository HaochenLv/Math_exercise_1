name: q2-b0b-residual-baseline

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  b0b:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Test
        run: pytest
      - name: Download frozen Q1 V10 anchor
        uses: actions/download-artifact@v4
        with:
          name: q1-exact-count-split-recombination-v10
          path: inputs/q1_v10_anchor
          github-token: ${{ github.token }}
          repository: HaochenLv/Math_exercise_1
          run-id: 34131373295
      - name: Run Q2 B0B complete residual baseline
        run: |
          python experiments/run_q2_b0b_residual_baseline.py \
            --q1-routes inputs/q1_v10_anchor/q1-routes.csv \
            --q1-assignments inputs/q1_v10_anchor/q1-assignments.csv \
            --output-dir outputs/q2/b0b_residual_baseline \
            --packing-time-limit 30
      - name: Upload B0B outputs
        uses: actions/upload-artifact@v4
        with:
          name: q2-b0b-residual-baseline
          path: outputs/q2/b0b_residual_baseline
          if-no-files-found: error
